# Before applying: create the SQL Server credentials secret referenced below, e.g.:
#   kubectl create secret generic sql-credentials -n dotnet-demo \
#     --from-literal=username=<sql-username> \
#     --from-literal=password=<sql-password>
apiVersion: v1
kind: Namespace
metadata:
  name: dotnet-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dot-net-core-microservice
  template:
    metadata:
      labels:
        app: dot-net-core-microservice
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Sql__Host
              value: "192.168.29.56"
            - name: Sql__Port
              value: "1433"
            - name: Sql__Database
              value: "ProductCatalogDb"
            - name: Sql__User
              valueFrom:
                secretKeyRef:
                  name: sql-credentials
                  key: username
            - name: Sql__Password
              valueFrom:
                secretKeyRef:
                  name: sql-credentials
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
spec:
  selector:
    app: dot-net-core-microservice
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dot-net-core-microservice
                port:
                  number: 80

# Before applying:
#   1. Create the Basic Auth secret:
#        kubectl create secret generic api-basic-auth -n dotnet-demo \
#          --from-literal=username=<api-username> \
#          --from-literal=password=<api-password>
#   2. Set up Microsoft Entra Workload ID for passwordless Azure SQL Database access -
#      run scripts/setup-workload-identity.sh, then replace CLIENT_ID_PLACEHOLDER below
#      with the user-assigned managed identity's client ID it prints.
#   3. Point Sql__Host at your Azure SQL Database (<server>.database.windows.net) -
#      Managed Identity auth does not work against the self-hosted dev SQL Server.
#   No SQL username/password secret is needed: the pod authenticates as the managed
#   identity via federated Workload ID, never storing a database credential at all.
#   4. Register the API in Microsoft Entra ID (run scripts/register-entra-api.sh) and
#      replace AZURE_AD_TENANT_ID_PLACEHOLDER / AZURE_AD_AUDIENCE_PLACEHOLDER below with
#      the values it prints, so callers can authenticate with a Bearer token instead of
#      (or alongside) Basic Auth.
apiVersion: v1
kind: Namespace
metadata:
  name: dotnet-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
  annotations:
    azure.workload.identity/client-id: CLIENT_ID_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dot-net-core-microservice
  template:
    metadata:
      labels:
        app: dot-net-core-microservice
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: dot-net-core-microservice
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: REPLACE_IMAGE
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: Sql__Host
              value: "<your-server>.database.windows.net"
            - name: Sql__Port
              value: "1433"
            - name: Sql__Database
              value: "ProductCatalogDb"
            - name: Sql__AuthenticationMode
              value: "ManagedIdentity"
            - name: AzureAd__TenantId
              value: "AZURE_AD_TENANT_ID_PLACEHOLDER"
            - name: AzureAd__Audience
              value: "AZURE_AD_AUDIENCE_PLACEHOLDER"
            - name: BasicAuth__Username
              valueFrom:
                secretKeyRef:
                  name: api-basic-auth
                  key: username
            - name: BasicAuth__Password
              valueFrom:
                secretKeyRef:
                  name: api-basic-auth
                  key: password
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
spec:
  selector:
    app: dot-net-core-microservice
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dot-net-core-microservice
  namespace: dotnet-demo
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dot-net-core-microservice
                port:
                  number: 80
